; Three supported boards — pick with `pio run -e <env>`:
;   esp32-s3-devkitc-1   ESP32-S3 N8R8 (reference board; needed for future wake-word)
;   esp32-devkit-v1      classic ESP32-WROOM 38-pin devkit (IR-blaster spares)
;   lilygo-t-a7670       LilyGo T-A7670x R2 (WROVER-E + LTE modem; 18650 = battery backup)
; Pin maps live in src/config.h, wiring tables in ../docs/wiring.md.

[env]
platform = espressif32@6.9.0
framework = arduino
board_build.filesystem = littlefs
monitor_speed = 115200

build_flags =
    -DCORE_DEBUG_LEVEL=2

lib_deps =
    lovyan03/LovyanGFX@^1.1.16
    esp32async/AsyncTCP@^3.3.2
    esp32async/ESPAsyncWebServer@^3.6.0
    bblanchon/ArduinoJson@^7.2.0
    knolleary/PubSubClient@^2.8
    fastled/FastLED@^3.7.8
    pololu/VL53L0X@^1.3.1
    adafruit/RTClib@^2.1.4

[env:esp32-s3-devkitc-1]
board = esp32-s3-devkitc-1
; ESP32-S3-DevKitC-1 N8R8: 8 MB flash, 8 MB octal PSRAM
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
board_build.arduino.memory_type = qio_opi
build_flags =
    ${env.build_flags}
    -DBOARD_HAS_PSRAM

[env:esp32-devkit-v1]
; Classic ESP32-WROOM-32 DevKit v1, 38-pin, 4 MB flash
board = esp32doit-devkit-v1

[env:lilygo-t-a7670]
; LilyGo T-A7670E/G/SA R2: ESP32-WROVER-E (4 MB flash + 8 MB PSRAM) + A7670 LTE
; modem (unused, held powered off). 18650 holder gives built-in battery backup.
board = esp32dev
build_flags =
    ${env.build_flags}
    -DBOARD_LILYGO_T_A7670
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
