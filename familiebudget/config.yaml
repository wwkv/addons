name: "Squirrel"
description: "Huishoudbudget"
version: "1.11.1"
# NB: de slug blijft bewust "familiebudget". Home Assistant gebruikt hem als
# identiteit én als pad voor de database (/addon_configs/{repo}_familiebudget).
# Hem hernoemen maakt er een nieuwe add-on van en laat je data achter.
slug: "familiebudget"
url: "https://github.com/wwkv/addons/familiebudget"
arch:
  - aarch64
  - amd64
init: false
startup: "application"
boot: "auto"
homeassistant_api: true
ingress: true
ingress_port: 3001
# Material Design Icons heeft geen eekhoorn — 7.447 iconen nagekeken, de enige
# knaagdieren zijn "rodent" (muis/rat, mét gekrulde staart) en "peanut". HA
# accepteert alleen mdi:-namen voor de zijbalk, geen eigen SVG, dus dit is zo
# dicht als de zijbalk kan komen. De échte eekhoorn staat in icon.png/logo.png
# en linksboven in de app zelf.
panel_icon: "mdi:rodent"
panel_title: "Squirrel"
map:
  - addon_config:rw
ports:
  3001/tcp: null
ports_description:
  3001/tcp: "Web interface (alleen nodig als je NIET via ingress wilt)"
options: {}
schema: {}
